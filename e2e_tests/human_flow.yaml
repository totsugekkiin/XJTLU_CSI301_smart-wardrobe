appId: com.smartwardrobe.local
env:
  ITEM: E2E-Human-Shirt
  LOOK: E2E-Human-Look
---
# Offline fallback is deliberate: no camera, photo permissions or network required.
# Run on a dedicated emulator; never clear a user's installed app.
- launchApp
- tapOn: 衣橱
- tapOn: ＋ 添加
- tapOn: 手动建档
- tapOn:
    text: 名称 \*
    index: 1
- inputText: ${ITEM}
- hideKeyboard
- tapOn: 选择类别 \*
- tapOn: 衬衫
- tapOn: 完成
- assertVisible: 衣物详情
- assertVisible: 可穿
- scrollUntilVisible:
    element: 洗涤 0 次    穿着 0 次
- assertVisible: 洗涤 0 次    穿着 0 次
- back
- tapOn: 穿搭
- tapOn: ＋ 新建搭配
- scrollUntilVisible:
    element: ＋ 添加单品
- tapOn: ＋ 添加单品
- tapOn:
    text: 搜索名称或品牌
    index: 1
- inputText: ${ITEM}
- hideKeyboard
- tapOn:
    text: ${ITEM}
    index: 1
- scrollUntilVisible:
    element: 穿搭名称 \*
- tapOn:
    text: 穿搭名称 \*
    index: 1
- inputText: ${LOOK}
- hideKeyboard
- back
- assertVisible: 继续编辑 · ${LOOK}
# A real process restart also verifies the SQLite draft, beyond back navigation.
- stopApp
- launchApp
- tapOn: 穿搭
- tapOn: 继续编辑 · ${LOOK}
- assertVisible: 搭配画布
- tapOn: 保存
- scrollUntilVisible:
    element: 记到日历
- tapOn: 记到日历
- tapOn: 确认
- assertVisible:
    text: 同时标为待洗
    checked: true
- tapOn: 保存记录
- assertVisible: ${LOOK}
- tapOn: 衣橱
- tapOn: ${ITEM}
- assertVisible: 待洗
- scrollUntilVisible:
    element: 洗涤 0 次    穿着 1 次
- assertVisible: 洗涤 0 次    穿着 1 次
